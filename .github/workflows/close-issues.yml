# Closes TRACKER's issues named by a closing keyword in commits pushed to main
# (Closes owner/tracker#N), since GitHub's own keywords don't cross repositories.
# The same file sits in every code repo with a private tracker; only TRACKER differs.
# Needs ISSUE_TRACKER_TOKEN: a fine-grained PAT with Issues read/write on the
# private trackers (one token shared by every code repo).
name: close-issues

on:
  push:
    branches: [main]

permissions: {}

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues named in pushed commits
        env:
          GH_TOKEN: ${{ secrets.ISSUE_TRACKER_TOKEN }}
          TRACKER: HefKer/nixos-issues
        run: |
          set -euo pipefail
          # Messages are read from the event file, never interpolated into the
          # script, so a commit message can't inject shell.
          jq -r '.commits[] | "\(.id)\t\(.message | gsub("\n"; " "))"' "$GITHUB_EVENT_PATH" |
          while IFS=$'\t' read -r sha msg; do
            { grep -ioP "\\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?\\s+\\Q$TRACKER\\E#\\K[0-9]+" <<<"$msg" || true; } |
            while read -r n; do
              state=$(gh issue view "$n" --repo "$TRACKER" --json state --jq .state)
              if [ "$state" = OPEN ]; then
                gh issue close "$n" --repo "$TRACKER" \
                  --comment "Closed by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha"
              else
                echo "#$n already $state"
              fi
            done
          done
